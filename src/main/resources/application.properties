server.port=8080
server.servlet.context-path=

# Base de datos H2 persistente en archivo local para desarrollo y demostración
spring.datasource.url=jdbc:h2:file:./data/ecorecicla;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (deshabilitada en producción, opcional)
spring.h2.console.enabled=false

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuración JWT
app.jwt.expiration-minutes=60
app.jwt.secret-path=./data/jwt.key
