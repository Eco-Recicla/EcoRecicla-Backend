# ===================================================================
# Perfil SC-B: Base de datos H2 aislada para evaluacion del Rol AUDITOR
# No altera los datos ni la demostracion de la Parte I (ecorecicla.mv.db)
# ===================================================================

server.port=8080

# Base de datos separada exclusiva para SC-B
spring.datasource.url=jdbc:h2:file:./data/ecorecicla-scb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Clave JWT y expiracion
app.jwt.expiration-minutes=60
app.jwt.secret-path=./data/jwt.key
